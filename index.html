<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Zoom is deliberately NOT disabled. `maximum-scale=1, user-scalable=no`
      (removed here) blocks pinch-zoom, which fails WCAG 2.1 SC 1.4.4; the
      layout is fluid rem-based, so it stays usable when zoomed.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Zenv - an offline, on-device password manager with deterministic, zero-knowledge password derivation." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Zenv</title>
    <!--
      No <meta http-equiv="Content-Security-Policy"> here on purpose: it would
      apply in development too, where `script-src 'self'` blocks Vite's inline
      HMR preamble. The policy is injected into the built HTML by the
      `zenv-csp` plugin in vite.config.ts, so it ships without breaking dev.
    -->
    <style>
      html, body, #root {
        height: 100%;
        height: 100dvh; /* Dynamic viewport height for mobile browsers */
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Prevent body scroll, handle scroll in containers */
        background-color: #000000;
        color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Safe Area Padding Utility */
      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      /* Smooth scrolling */
      .scroll-smooth {
        -webkit-overflow-scrolling: touch;
      }

      /* Custom Scrollbar for hidden but functional scrolling */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }

      /* Input Range Reset */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        cursor: pointer;
        margin-top: -8px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }
    </style>
  
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #fff;">
        Zenv is a client-side password manager and requires JavaScript. Nothing
        is stored on a server, so there is no fallback page to render.
      </p>
    </noscript>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
