<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Glowing background orb -->
  <circle cx="640" cy="240" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(600, 140)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <path d="M25 28 L55 28 L30 52 L55 52" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title -->
  <text x="640" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">ZenV</text>

  <!-- Tagline -->
  <text x="640" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Airgapped Deterministic Identity Vault for Android &amp; Web</text>

  <!-- Technical badges row -->
  <g transform="translate(290, 410)">
    <!-- Badge 1: Zero Storage -->
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="27" text-anchor="middle" font-family="monospace" font-size="14" fill="#38bdf8">Zero Storage / On-the-fly</text>

    <!-- Badge 2: Airgapped -->
    <rect x="220" y="0" width="240" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="340" y="27" text-anchor="middle" font-family="monospace" font-size="14" fill="#10b981">Airgapped (No INTERNET)</text>

    <!-- Badge 3: Crypto -->
    <rect x="480" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="590" y="27" text-anchor="middle" font-family="monospace" font-size="14" fill="#f59e0b">PBKDF2 + AES-256-GCM</text>
  </g>

  <!-- Footer URL -->
  <text x="640" y="550" text-anchor="middle" font-family="monospace" font-size="16" fill="#64748b">https://github.com/ashroxy/zenv</text>
</svg>
