<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes typeService {
        0%, 15% { width: 0px; }
        35%, 100% { width: 140px; }
      }
      @keyframes revealPass {
        0%, 45% { opacity: 0; transform: translateY(4px); }
        55%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes timerSweep {
        0%, 55% { width: 160px; }
        100% { width: 30px; }
      }
      .cursor { animation: blink 1s infinite; }
      .service-typing { overflow: hidden; white-space: nowrap; display: inline-block; animation: typeService 6s infinite; }
      .pass-reveal { animation: revealPass 6s infinite; }
      .timer-bar { animation: timerSweep 6s infinite ease-out; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="800" height="44" rx="16" fill="#1e293b" />
  <rect y="28" width="800" height="16" fill="#1e293b" />
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="400" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">ZenV — Deterministic Credential Derivation</text>

  <!-- Container -->
  <g transform="translate(60, 75)">
    <!-- Master Key Input -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">MASTER PASSKEY</text>
    <rect x="0" y="30" width="680" height="48" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="60" font-family="'JetBrains Mono', monospace" font-size="16" fill="#10b981">●●●●●●●●●●●●●●●●</text>
    <text x="640" y="60" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#059669">UNLOCKED (RAM ONLY)</text>

    <!-- Service Input -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">SERVICE / DOMAIN</text>
    <rect x="0" y="125" width="440" height="48" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="155" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f8fafc">github.com<tspan fill="#10b981" class="cursor">|</tspan></text>

    <!-- Counter / Version -->
    <text x="460" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">COUNTER</text>
    <rect x="460" y="125" width="220" height="48" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="155" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f8fafc">#1 <tspan fill="#64748b" font-size="12">(active)</tspan></text>

    <!-- Generated Password Display Box -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">DETERMINISTIC OUTPUT (PBKDF2-HMAC-SHA256 · 100K ITERATIONS)</text>
    <rect x="0" y="220" width="680" height="64" rx="10" fill="#090d16" stroke="#10b981" stroke-width="2"/>

    <g class="pass-reveal">
      <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#38bdf8" letter-spacing="1.5">wK7#mP9$xL2!vR5*</text>
      <!-- Copy Badge -->
      <rect x="520" y="234" width="136" height="36" rx="6" fill="#10b981" />
      <text x="588" y="257" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#022c22">COPIED TO CLIP</text>
    </g>

    <!-- Auto-clear Security Countdown -->
    <g transform="translate(0, 300)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Airgap clipboard wipe in 30s:</text>
      <rect x="180" y="2" width="160" height="12" rx="6" fill="#1e293b"/>
      <rect x="180" y="2" width="160" height="12" rx="6" fill="#10b981" class="timer-bar"/>
      <text x="500" y="12" font-family="monospace" font-size="11" fill="#475569">0 Network Packets · 0 Disk Plaintext</text>
    </g>
  </g>
</svg>
